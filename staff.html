  <footer class="site-footer"></footer>
  <script>

      'BIM & Construction Management',

      'Hydropower & Water Resource',

      'Structure',
      'Urban Planning'
    ];

      { name: 'Nawaz Sb', role: 'Manager, Admin and Finance', department: 'Admin & Finance' },
      { name: 'Nasir Ahmed', role: 'General Manager, Finance', department: 'Admin & Finance' },
      { name: 'Asma Munir', role: 'Accountant and Assistant Manager', department: 'Admin & Finance' },
      { name: 'Shahzad', role: 'Receptionist / Admin Assistant', department: 'Admin & Finance' },
      { name: 'Nasir Khan', role: 'Chief Architect', department: 'Architecture' },
      { name: 'Noor Ul Haq Siddiqui', role: 'Principal Architect', department: 'Architecture' },
      { name: 'Syed Waqar Haziq', role: 'Architect', department: 'Architecture' },
      { name: 'M. Rizwan Rasul', role: 'Architect', department: 'Architecture' },
      { name: 'Mahmood Pervaiz', role: 'Chief Engineer', department: 'BIM & Construction Management' },
      { name: 'Imran Khan', role: 'Resident Engineer', department: 'BIM & Construction Management' },
      { name: 'M. Umair', role: 'BIM Expert', department: 'BIM & Construction Management' },
      { name: 'Mohsan Khan', role: 'Manager, Business Development and IT', department: 'Business Development' },
      { name: 'Laiba Jawed', role: 'Assistant Manager', department: 'Business Development' },
      { name: 'Naeem Ul Haq', role: 'Business Development Officer', department: 'Business Development' },
      { name: 'Kashif Jauhar', role: 'IT Officer', department: 'Business Development' },
      { name: 'Mujeeb Ahmed', role: 'Project Manager', department: 'Contract Management' },
      { name: 'Mahmood Pervaiz', role: 'Chief Engineer', department: 'Contract Management' },
      { name: 'Hane Ur Rehman', role: 'Contracts Specialist', department: 'Contract Management' },
      { name: 'M. Ayaz', role: 'Chief Engineer', department: 'Contract Management' },
      { name: 'Ghulam Abbas', role: 'Social Expert', department: 'GIS & Environment' },
      { name: 'Tariq Mehmood', role: 'Social Services Project', department: 'GIS & Environment' },
      { name: 'Bisma Guleraz', role: 'Social Services Project', department: 'GIS & Environment' },
      { name: 'Sara Yaseen', role: 'GIS Expert', department: 'GIS & Environment' },
      { name: 'Mohsin Raza', role: 'Health and Safety Expert', department: 'GIS & Environment' },
      { name: 'Abdul Hameed Khan', role: 'Chief Engineer, Hydropower / Dams', department: 'Hydropower & Water Resource' },
      { name: 'Najam-us-Saqib', role: 'Principal Engineer', department: 'Hydropower & Water Resource' },
      { name: 'Zubair Hafeez', role: 'Hydrologist', department: 'Hydropower & Water Resource' },

      { name: 'Laiba Jawed', role: 'Electrical Engineer', department: 'MEP Engineering' },

      { name: 'M. Babar', role: 'Senior Mechanical Engineer', department: 'MEP Engineering' },

      { name: 'Najeeb Ullah', role: 'Senior Mechanical Engineer', department: 'MEP Engineering' },
      { name: 'Zeeshan Ul Haq', role: 'Mechanical Engineer', department: 'MEP Engineering' },
      { name: 'Najib Ahmad Shakir', role: 'Director / Chief Structures', department: 'Structure' },

      { name: 'Shahzad Aslam', role: 'Structural Engineer', department: 'Structure' },
      { name: 'Imran Siddique', role: 'Structural Engineer', department: 'Structure' },
      { name: 'Khalid Mehmood', role: 'Chief Town Planner', department: 'Urban Planning' },
      { name: 'Najam-us-Saqib', role: 'Principal Engineer', department: 'Urban Planning' },
      { name: 'Awais Bajwa', role: 'Engineer', department: 'Urban Planning' }
    ];

    function escapeStaffText(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    }

    function staffInitials(name) {
      return name.split(/\s+/).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
    }

    const staffCards = document.getElementById('staffCards');
    const staffDialog = document.getElementById('staffDialog');
    const staffDialogName = document.getElementById('staffDialogName');
    const staffDialogRole = document.getElementById('staffDialogRole');
    const staffDialogDepartment = document.getElementById('staffDialogDepartment');
    const staffDialogPortrait = document.getElementById('staffDialogPortrait');
    const staffFilterToggle = document.getElementById('staffFilterToggle');
    const staffSidebar = document.querySelector('.staff-sidebar');

    staffFilterToggle.addEventListener('click', () => {
      const isExpanded = staffFilterToggle.getAttribute('aria-expanded') === 'true';
      staffFilterToggle.setAttribute('aria-expanded', String(!isExpanded));
      staffFilterToggle.setAttribute('aria-label', isExpanded ? 'Open staff filters' : 'Close staff filters');
      staffSidebar.classList.toggle('is-open', !isExpanded);
    });

    function renderStaff(department) {
      const visibleStaff = staffMembers.filter((member) => member.department === department);

      staffCards.innerHTML = visibleStaff.length
        ? visibleStaff.map((member) => `
          <article class="staff-card">
            <button class="staff-person-trigger" type="button" aria-label="View ${escapeStaffText(member.name)} details" data-staff-name="${escapeStaffText(member.name)}" data-staff-role="${escapeStaffText(member.role)}" data-staff-department="${escapeStaffText(member.department)}">
              <span class="staff-portrait" aria-hidden="true"><span>${staffInitials(member.name)}</span></span>
              <span class="staff-image-overlay"><span class="staff-image-title">${escapeStaffText(member.name)}</span></span>
            </button>
          </article>
        `).join('')
        : '<p class="staff-empty">No staff profiles are listed for this department.</p>';
    }

    const departmentList = document.getElementById('staffDepartments');
    departments.forEach((department, index) => {
      const filter = document.createElement('button');
      filter.type = 'button';
      filter.className = `project-filter staff-department-filter${index === 0 ? ' is-active' : ''}`;
      if (department === 'Hydropower & Water Resource') {
        filter.append('Hydropower & Water', document.createElement('br'), 'Resource');
      } else {
        filter.textContent = department;
      }
      filter.setAttribute('aria-label', department);
      filter.setAttribute('aria-pressed', String(index === 0));
      filter.addEventListener('click', () => {
        departmentList.querySelectorAll('.staff-department-filter').forEach((button) => {
          button.classList.remove('is-active');
          button.setAttribute('aria-pressed', 'false');
        });
        filter.classList.add('is-active');
        filter.setAttribute('aria-pressed', 'true');
        renderStaff(department);
        staffSidebar.classList.remove('is-open');
        staffFilterToggle.setAttribute('aria-expanded', 'false');
        staffFilterToggle.setAttribute('aria-label', 'Open staff filters');
      });
      departmentList.appendChild(filter);
    });

    staffCards.addEventListener('click', (event) => {
      const trigger = event.target.closest('.staff-person-trigger');
      if (!trigger) return;
      staffDialogName.textContent = trigger.dataset.staffName;
      staffDialogRole.textContent = trigger.dataset.staffRole;
      staffDialogDepartment.textContent = trigger.dataset.staffDepartment;
      staffDialogPortrait.textContent = staffInitials(trigger.dataset.staffName);
      staffDialog.showModal();
    });

    document.getElementById('closeStaffDialog').addEventListener('click', () => staffDialog.close());
    staffDialog.addEventListener('click', (event) => {
      if (event.target === staffDialog) staffDialog.close();
    });

    renderStaff(departments[0]);
  </script>

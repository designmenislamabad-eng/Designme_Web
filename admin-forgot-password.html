<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Forgot Password | Designmen</title>
  <link rel="icon" href="assets/web-logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>
<body class="login-page">
  <main class="login-shell" id="forgotShell" hidden>
    <a class="login-brand" href="index.html"><img src="assets/Logo.jpg" alt="Designmen Consulting Engineers" /></a>
    <section class="login-panel">
      <p class="eyebrow">Administrator access</p>
      <h1>Forgot password?</h1>
      <p class="login-intro">Admin email enter karein. Password reset link aapke inbox mein bheja jayega.</p>
      <form id="forgotForm">
        <label for="forgotEmail">Admin email</label>
        <input id="forgotEmail" type="email" autocomplete="username" required />
        <button class="btn btn-primary" type="submit" id="sendResetButton">Send reset link</button>
      </form>
      <p class="form-message" id="forgotMessage" role="status" aria-live="polite"></p>
      <a class="back-link" href="admin-login.html">Back to admin login</a>
    </section>
  </main>
  <p class="loading-state" id="forgotLoading" role="status">Preparing password recovery...</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-forgot-password.js"></script>
</body>
</html>

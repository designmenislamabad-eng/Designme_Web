<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Admin Password | Designmen</title>
  <link rel="icon" href="assets/web-logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>
<body class="login-page">
  <main class="login-shell" id="resetShell" hidden>
    <a class="login-brand" href="index.html"><img src="assets/Logo.jpg" alt="Designmen Consulting Engineers" /></a>
    <section class="login-panel">
      <p class="eyebrow">Administrator access</p>
      <h1>Set a new password</h1>
      <p class="login-intro" id="resetEmail"></p>
      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required />
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
        <button class="btn btn-primary" type="submit" id="resetButton">Update password</button>
      </form>
      <p class="form-message" id="resetMessage" role="status" aria-live="polite"></p>
      <a class="back-link" href="admin-login.html">Back to admin login</a>
    </section>
  </main>
  <p class="loading-state" id="resetLoading" role="status">Checking password reset link...</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-reset-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | Designmen</title>
  <link rel="icon" href="assets/web-logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="admin-dashboard.css" />
</head>
<body class="login-page">
  <main class="login-shell" id="loginShell" hidden>
    <a class="login-brand" href="index.html"><img src="assets/Logo.jpg" alt="Designmen Consulting Engineers" /></a>
    <section class="login-panel">
      <p class="eyebrow">Administrator access</p>
      <h1 id="loginTitle">Sign in</h1>
      <p class="login-intro" id="loginIntro">Website content workspace</p>
      <form id="loginForm">
        <label for="email">Admin email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <div class="password-control"><input id="password" type="password" minlength="8" autocomplete="current-password" required /><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button></div>
        <a class="text-button forgot-password" id="forgotPasswordLink" href="admin-forgot-password.html">Forgot password?</a>
        <button class="btn btn-primary" type="submit" id="loginButton">Sign in</button>
      </form>
      <button class="text-button signup-toggle" id="signupToggle" type="button">First time? Create admin account</button>
      <div class="login-divider" id="loginDivider" aria-hidden="true"><span>or</span></div>
      <button class="btn btn-google" id="googleLoginButton" type="button">
        <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.27 5.64c4.25-3.92 7.5-9.71 7.5-17.29z" />
          <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.55 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.27-5.64c-2.02 1.36-4.6 2.17-8.64 2.17-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <form id="otpForm" hidden>
        <label for="otpCode">6-digit email code</label>
        <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
        <button class="btn btn-primary" type="submit" id="verifyOtpButton">Verify code</button>
        <button class="text-button forgot-password" id="resendOtpButton" type="button">Send a new code</button>
        <button class="text-button forgot-password" id="changeAccountButton" type="button">Use another account</button>
      </form>
      <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
      <a class="back-link" href="index.html">Back to website</a>
    </section>
  </main>
  <p class="loading-state" id="loginLoading" role="status">Preparing secure sign-in...</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="password-visibility.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
